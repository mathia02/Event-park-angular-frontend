<div class="auth-page">

  <div class="auth-card">

    <div class="brand">
      EventPark
    </div>

    <h2>
      Reset Password
    </h2>

    <p class="subtitle">
      Create a new password for your account.
    </p>

    <div
      *ngIf="!token"
      class="error-alert"
    >
      Password reset token is missing.
    </div>

    <div
      *ngIf="errorMessage"
      class="error-alert"
    >
      {{ errorMessage }}
    </div>

    <div
      *ngIf="successMessage"
      class="success-alert"
    >
      {{ successMessage }}
    </div>

    <form
      *ngIf="token && !successMessage"
      [formGroup]="form"
      (ngSubmit)="submit()"
    >

      <div class="form-group">

        <label for="newPassword">
          New Password
        </label>

        <input
          id="newPassword"
          type="password"
          formControlName="newPassword"
          placeholder="Enter new password"
        >

        <small
          *ngIf="
            newPassword.touched &&
            newPassword.hasError('required')
          "
          class="field-error"
        >
          New password is required.
        </small>

        <small
          *ngIf="
            newPassword.touched &&
            newPassword.hasError('minlength')
          "
          class="field-error"
        >
          Password must contain at least
          6 characters.
        </small>

      </div>

      <div class="form-group">

        <label for="confirmPassword">
          Confirm Password
        </label>

        <input
          id="confirmPassword"
          type="password"
          formControlName="confirmPassword"
          placeholder="Confirm new password"
        >

        <small
          *ngIf="
            confirmPassword.touched &&
            confirmPassword.hasError('required')
          "
          class="field-error"
        >
          Confirm password is required.
        </small>

        <small
          *ngIf="
            confirmPassword.touched &&
            form.hasError('passwordMismatch')
          "
          class="field-error"
        >
          Passwords do not match.
        </small>

      </div>

      <button
        type="submit"
        [disabled]="isLoading"
      >
        {{ isLoading
          ? 'Resetting...'
          : 'Reset Password'
        }}
      </button>

    </form>

    <a
      *ngIf="successMessage"
      routerLink="/login"
      class="login-button"
    >
      Continue to Login
    </a>

    <a
      routerLink="/login"
      class="back-link"
    >
      Back to Login
    </a>

  </div>

</div>
